name: Deploy moysoft website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_HOOK }}
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          BUILD_HOOK: ${{ secrets.BUILD_HOOK }}
          NETLIFY_HOOK_VAR: ${{ vars.NETLIFY_HOOK }}
        run: |
          raw_hook_url="${NETLIFY_HOOK:-${NETLIFY_BUILD_HOOK:-${BUILD_HOOK:-$NETLIFY_HOOK_VAR}}}"
          hook_url="$(printf '%s' "$raw_hook_url" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          hook_length="$(printf '%s' "$hook_url" | wc -c | tr -d ' ')"

          if [ -n "$NETLIFY_HOOK" ]; then
            hook_source="NETLIFY_HOOK secret"
          elif [ -n "$NETLIFY_BUILD_HOOK" ]; then
            hook_source="NETLIFY_BUILD_HOOK secret"
          elif [ -n "$BUILD_HOOK" ]; then
            hook_source="BUILD_HOOK secret"
          elif [ -n "$NETLIFY_HOOK_VAR" ]; then
            hook_source="NETLIFY_HOOK variable"
          else
            hook_source="empty"
          fi

          echo "Netlify hook source: $hook_source"
          echo "NETLIFY_HOOK length after cleanup: $hook_length"

          if [ -z "$hook_url" ]; then
            echo "Netlify build hook is missing. Add NETLIFY_BUILD_HOOK as a repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ "$hook_url" != https://api.netlify.com/build_hooks/* ]]; then
            echo "NETLIFY_HOOK must be a full Netlify build hook URL starting with https://api.netlify.com/build_hooks/."
            exit 1
          fi

          echo "Triggering Netlify build hook..."
          response_file="$(mktemp)"
          http_status="$(curl --show-error --silent -o "$response_file" -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$hook_url")"

          echo "Netlify response status: $http_status"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -gt 299 ]; then
            echo "Netlify rejected the build hook request."
            cat "$response_file"
            exit 1
          fi
